[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penguin-burner"
version = "0.1.4"
description = "Nvidia GPU Undervolting Tool with Auto-UV and MSI Afterburner import support"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "PenguinBurner contributors" },
]
keywords = [
  "nvidia",
  "undervolting",
  "linux",
  "gpu",
  "q2rtx",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware",
]
dependencies = [
  "PySide6>=6.7",
  "pyqtgraph>=0.13",
]

[project.optional-dependencies]
ui = [
  # Compatibility alias for older docs/users. GUI dependencies are installed by
  # the base package too, so plain `pip install penguin-burner` is enough.
  "PySide6>=6.7",
  "pyqtgraph>=0.13",
]

[project.urls]
Homepage = "https://github.com/jpietek/PenguinBurner"
Issues = "https://github.com/jpietek/PenguinBurner/issues"
Source = "https://github.com/jpietek/PenguinBurner"

[project.scripts]
penguin-burner = "penguin_burner_ui:main"
pburn = "penguin_burner_ui:main"
penguin-burner-ui = "penguin_burner_ui:main"
pburn-ui = "penguin_burner_ui:main"
penguin-burner-yolo = "penguin_burner_ui:main_yolo"
pburn-yolo = "penguin_burner_ui:main_yolo"
penguin-burner-cli = "penguin_burner:cli_main"
pburn-cli = "penguin_burner:cli_main"
q2rtx-stability = "stability.q2rtx:main"
cuda-bruteforce-stability = "stability.cuda_bruteforce:main"
penguin-burner-import-afterburner-vf = "afterburner.import_vf_curve:main"
penguin-burner-import-afterburner-fan = "afterburner.import_fan_curve:main"

[tool.setuptools]
py-modules = [
  "ascii_chart",
  "cli_output",
  "cuda_bruteforce_stability",
  "dry_run_preview",
  "hidden_nvapi_vf",
  "hidden_nvml_voltage",
  "import_afterburner_fan_curve",
  "import_afterburner_vf_curve",
  "nvidia_runtime_defaults",
  "nvml_gpu_policy",
  "penguin_burner",
  "penguin_burner_paths",
  "q2rtx_stability",
  "runtime_debug",
  "runtime_service",
  "subprocess_locale",
]
packages = [
  "afterburner",
  "auto_uv",
  "lact",
  "penguin_burner_ui",
  "penguin_burner_ui.assets",
  "penguin_burner_ui.components",
  "stability",
  "stability.q2rtx",
]

[tool.setuptools.package-data]
"penguin_burner_ui.assets" = [
  "*.png",
]

[tool.setuptools.data-files]
"share/penguin-burner" = [
  "PenguinBurner.service",
  "penguin_burner.sh",
]
"share/applications" = [
  "packaging/linux/io.github.jpietek.PenguinBurner.desktop",
]
"share/icons/hicolor/256x256/apps" = [
  "packaging/icons/hicolor/256x256/apps/penguin-burner.png",
]
"share/icons/hicolor/512x512/apps" = [
  "packaging/icons/hicolor/512x512/apps/penguin-burner.png",
]
