[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penguin-burner"
version = "0.5.8"
description = "NVIDIA GPU tuning tool for Linux: automatic and adaptive undervolting, an in-game monitoring overlay with PC latency and pre-frame-generation FPS, plus MSI Afterburner imports and LACT exports"
requires-python = ">=3.11"
dynamic = ["readme"]
license = { file = "LICENSE" }
authors = [
  { name = "PenguinBurner contributors" },
]
keywords = [
  "nvidia",
  "undervolting",
  "linux",
  "gpu",
  "q2rtx",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware",
]
dependencies = [
  "PySide6-Essentials>=6.7",
  "colorama>=0.4",
  "pyqtgraph>=0.13",
]

[project.optional-dependencies]
ui = [
  # Compatibility alias for older docs/users. GUI dependencies are installed by
  # the base package too, so plain `pip install penguin-burner` is enough.
  "PySide6-Essentials>=6.7",
  "colorama>=0.4",
  "pyqtgraph>=0.13",
]

[project.urls]
Homepage = "https://github.com/jpietek/PenguinBurner"
Issues = "https://github.com/jpietek/PenguinBurner/issues"
Source = "https://github.com/jpietek/PenguinBurner"

[project.scripts]
penguin-burner = "ui.main:main"
pburn = "ui.main:main"
penguin-burner-ui = "ui.main:main"
pburn-ui = "ui.main:main"
penguin-burner-cli = "penguin_burner:cli_main"
pburn-cli = "penguin_burner:cli_main"
PENGUIN_BURNER = "overlay.launcher:main"
penguin-burner-install-wrappers = "common.flatpak_wrappers:main"

[tool.setuptools]
py-modules = [
  "penguin_burner",
]
packages = [
  "auto_uv",
  "auto_uv.auto_oc",
  "auto_uv.curve",
  "auto_uv.domain",
  "auto_uv.efficiency_tune",
  "auto_uv.final_verification",
  "auto_uv.gpu",
  "auto_uv.initial_check",
  "auto_uv.persistence",
  "auto_uv.q2rtx",
  "auto_uv.run",
  "auto_uv.scan_mode",
  "auto_uv.shared",
  "stability",
  "stability.q2rtx",
  "ui.features.auto_uv",
  "cli",
  "common",
  "curve_editors",
  "curve_editors.fan",
  "curve_editors.uv",
  "integrations",
  "integrations.afterburner",
  "integrations.lact",
  "drivers",
  "drivers.nvidia",
  "overlay",
  "overlay.telemetry",
  "runtime",
  "runtime.support",
  "runtime.fan_control",
  "runtime.gpu_control",
  "runtime.stability_test",
  "profiles",
  "profiles.verification",
  "profiles.uv",
  "ui",
  "ui.assets",
  "ui.components",
  "ui.controllers",
  "ui.dialogs",
  "ui.features",
  "ui.features.curves",
  "ui.features.integrations",
  "ui.features.profiles",
  "ui.features.tuning",
]

[tool.setuptools.package-data]
"overlay" = [
  "native_layer/*.json",
  "native_layer/*.so",
]
"ui.assets" = [
  "*.png",
]

[tool.setuptools.data-files]
"share/penguin-burner" = [
  "penguin_burner.sh",
]
"share/applications" = [
  "packaging/linux/io.github.jpietek.PenguinBurner.desktop",
]
"share/icons/hicolor/256x256/apps" = [
  "packaging/icons/hicolor/256x256/apps/penguin-burner.png",
]
"share/icons/hicolor/512x512/apps" = [
  "packaging/icons/hicolor/512x512/apps/penguin-burner.png",
]

[tool.pytest.ini_options]
# Keep collection inside our own suite; never walk vendored third_party/ trees.
testpaths = ["tests"]
