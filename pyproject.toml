[build-system]
requires = ["setuptools>=69", "wheel", "cmake>=3.20"]
build-backend = "setuptools.build_meta"

[project]
name = "penguin-burner"
version = "0.4.3"
description = "NVIDIA GPU tuning tool for Linux: automatic and adaptive undervolting, an in-game monitoring overlay with PC latency and pre-frame-generation FPS, plus MSI Afterburner imports and LACT exports"
requires-python = ">=3.11"
dynamic = ["readme"]
license = { file = "LICENSE" }
authors = [
  { name = "PenguinBurner contributors" },
]
keywords = [
  "nvidia",
  "undervolting",
  "linux",
  "gpu",
  "q2rtx",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware",
]
dependencies = [
  "PySide6>=6.7",
  "colorama>=0.4",
  "pyqtgraph>=0.13",
]

[project.optional-dependencies]
ui = [
  # Compatibility alias for older docs/users. GUI dependencies are installed by
  # the base package too, so plain `pip install penguin-burner` is enough.
  "PySide6>=6.7",
  "colorama>=0.4",
  "pyqtgraph>=0.13",
]

[project.urls]
Homepage = "https://github.com/jpietek/PenguinBurner"
Issues = "https://github.com/jpietek/PenguinBurner/issues"
Source = "https://github.com/jpietek/PenguinBurner"

[project.scripts]
penguin-burner = "ui:main"
pburn = "ui:main"
penguin-burner-ui = "ui:main"
pburn-ui = "ui:main"
penguin-burner-cli = "penguin_burner:cli_main"
pburn-cli = "penguin_burner:cli_main"
q2rtx-stability = "stability.q2rtx:main"
cuda-bruteforce-stability = "stability.cuda_bruteforce:main"
penguin-burner-import-afterburner-vf = "afterburner.import_vf_curve:main"
penguin-burner-import-afterburner-fan = "afterburner.import_fan_curve:main"
penguin-burner-steam-launch-check = "latency_telemetry.steam_launch_check:main"
penguin-burner-steam-game-setup = "latency_telemetry.steam_game_setup:main"
PB_OVERLAY = "overlay.launcher:main"
PENGUIN_BURNER = "overlay.launcher:main"
penguin-burner-overlay = "overlay.launcher:main"
pburn-overlay = "overlay.launcher:main"
pb-overlay = "overlay.launcher:main"
penguin-burner-overlay-text = "overlay.overlay_text:main"
pburn-overlay-text = "overlay.overlay_text:main"
pb-overlay-text = "overlay.overlay_text:main"

[tool.setuptools]
py-modules = [
  "penguin_burner",
]
packages = [
  "afterburner",
  "auto_oc",
  "auto_uv",
  "auto_uv.curve",
  "auto_uv.efficiency_tune",
  "auto_uv.final_verification",
  "auto_uv.gpu",
  "auto_uv.persistence",
  "auto_uv.q2rtx",
  "auto_uv.scan_mode",
  "auto_uv.shared",
  "auto_uv.ui",
  "cli",
  "common",
  "initial_check",
  "lact",
  "latency_telemetry",
  "manual_fan_curve_editor",
  "manual_uv_curve_editor",
  "nvidia_driver",
  "overlay",
  "runtime_support",
  "runtime_fan_control",
  "runtime_gpu_control",
  "runtime_stability_test",
  "saved_profile_verification",
  "saved_uv_profiles",
  "ui",
  "ui.assets",
  "ui.components",
  "ui.controllers",
  "ui.dialogs",
  "stability",
  "stability.q2rtx",
]

[tool.setuptools.package-data]
"overlay" = [
  "native_layer/*.json",
  "native_layer/*.so",
]
"ui.assets" = [
  "*.png",
]

[tool.setuptools.data-files]
"share/penguin-burner" = [
  "PenguinBurner.service",
  "penguin_burner.sh",
]
"share/applications" = [
  "packaging/linux/io.github.jpietek.PenguinBurner.desktop",
]
"share/icons/hicolor/256x256/apps" = [
  "packaging/icons/hicolor/256x256/apps/penguin-burner.png",
]
"share/icons/hicolor/512x512/apps" = [
  "packaging/icons/hicolor/512x512/apps/penguin-burner.png",
]

[tool.pytest.ini_options]
# Keep collection inside our own suite; never walk vendored third_party/ trees.
testpaths = ["tests"]
