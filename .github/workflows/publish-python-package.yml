name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/penguin-burner
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Check whether version already exists on PyPI
        id: pypi-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            python - <<'PY'
          from pathlib import Path
          import re

          for path in Path("dist").glob("penguin_burner-*.tar.gz"):
              match = re.fullmatch(r"penguin_burner-(.+)\.tar\.gz", path.name)
              if match:
                  print(match.group(1))
                  break
          else:
              raise SystemExit("could not infer package version from dist/")
          PY
          )"
          status="$(curl -fsS -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/penguin-burner/${version}/json" || true)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "penguin-burner ${version} already exists on PyPI; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to PyPI
        if: steps.pypi-version.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
